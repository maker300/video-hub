# Render lesson videos to MP4 on Linux.
#
# Remotion's macOS compositor needs macOS 15+, which the dev machine does not
# have, so encoding happens here instead. Run it from the Actions tab, give it
# a lesson id (or "--all"), and download the MP4s from the run's artifacts.
name: Render lesson videos

on:
  workflow_dispatch:
    inputs:
      lessons:
        description: 'Lesson id(s), space separated — or --all'
        required: true
        default: 'lesson-1-1'
      preview_seconds:
        description: 'Render only the first N seconds (0 = full lesson)'
        required: false
        default: '0'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Chromium dependencies for Remotion's headless renderer
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libgbm1 libatk-bridge2.0-0 libcups2 libpango-1.0-0 fonts-liberation

      - run: npm ci

      - name: Render
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          # Passed as env rather than interpolated into the script body, so a
          # dispatch input can't inject shell.
          LESSONS: ${{ inputs.lessons }}
          PREVIEW_SECONDS: ${{ inputs.preview_seconds }}
        run: |
          PREVIEW=""
          if [ -n "$PREVIEW_SECONDS" ] && [ "$PREVIEW_SECONDS" != "0" ]; then
            PREVIEW="--preview=$PREVIEW_SECONDS"
          fi
          node scripts/render-lesson.mjs $LESSONS $PREVIEW --concurrency=2

      - name: Upload MP4s
        uses: actions/upload-artifact@v4
        with:
          name: lesson-videos
          path: rendered-videos/*.mp4
          retention-days: 14
          if-no-files-found: error
