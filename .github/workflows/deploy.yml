name: Deploy to Vercel

# Replaces the previous "Deploy to Hostinger" workflow, which triggered on a
# branch this repo does not use (main, vs fresh_main) and never deployed
# anything — it built the project and echoed a message about a host we no
# longer run on.
#
# Env vars are pulled from the Vercel project by `vercel pull`, so they do not
# need to be duplicated as GitHub secrets. Only three secrets are required:
#   VERCEL_TOKEN        — https://vercel.com/account/tokens
#   VERCEL_ORG_ID       — team_YTLlqtd33szNqbuY1jnFLilY
#   VERCEL_PROJECT_ID   — prj_p5MEVmrMyLQMVqauMaONV4CXD6Rg

on:
  push:
    branches: [ fresh_main ]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
