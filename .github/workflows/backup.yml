name: Nightly DB backup — Neon → Supabase

# Warm-standby backup. Runs once a day at 04:00 UTC (quiet hours for both
# EU and US), streams a full logical dump from Neon straight into Supabase.
# When Neon hits its transfer quota or has any other outage, admin flips
# DATABASE_URL in Vercel to the Supabase connection string and the site
# comes back online at "last night's" data (up to 24h of writes lost —
# accepted tradeoff for a free-tier failover setup; see docs/failover-runbook.md).
#
# workflow_dispatch is enabled so the backup can be triggered manually just
# before a planned change (schema migration, admin action that could break
# things) to get a fresher snapshot.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   NEON_DATABASE_URL       — same value as Vercel's DATABASE_URL today
#   SUPABASE_DATABASE_URL   — Supabase project's SESSION-mode connection string
#                             (port 5432 direct, NOT the :6543 pgbouncer pooled
#                             URL — pg_dump needs a real session connection).
#   TELEGRAM_BOT_TOKEN      — bot token used by the site already
#   TELEGRAM_CHAT_ID        — admin chat id, so failures reach a human

on:
  schedule:
    - cron: '0 4 * * *'    # 04:00 UTC daily
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL 17 client
        # Ubuntu 24.04's default postgresql-client is v16 but Neon runs
        # v17.11 — pg_dump refuses to dump from a newer server than itself.
        # PGDG apt repo carries postgresql-client-17, which handles both
        # our current Neon (17.x) and Supabase (17.6) sides.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
          psql --version

      - name: Dump Neon → Supabase
        env:
          NEON_URL:     ${{ secrets.NEON_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          set -euo pipefail

          # --clean + --if-exists   → drops each table before recreating so
          #                           Supabase always ends up structurally
          #                           identical to Neon (no drift from a
          #                           schema migration we forgot to run on
          #                           the standby).
          # --no-owner --no-privileges
          #                         → Supabase's role names differ from
          #                           Neon's; skipping ownership avoids
          #                           permission errors on restore.
          # --format=plain          → streamable through psql on stdin.
          pg_dump \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            --format=plain \
            "$NEON_URL" \
          | psql \
              --single-transaction \
              --set ON_ERROR_STOP=on \
              "$SUPABASE_URL"

      - name: Notify Telegram on failure
        if: failure() && env.TG_TOKEN != '' && env.TG_CHAT != ''
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=🚨 Nightly Neon→Supabase backup FAILED. Standby DB is now at least 24h behind. GitHub Actions run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Record success timestamp
        if: success()
        env:
          NEON_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          # Stamp the last-successful-backup time in Neon's AdminSetting
          # table so the admin panel can show freshness at a glance.
          set -euo pipefail
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          psql "$NEON_URL" -c "
            INSERT INTO \"AdminSetting\" (key, value, \"updatedAt\")
            VALUES ('last_backup_at', to_jsonb('$NOW'::text), NOW())
            ON CONFLICT (key) DO UPDATE
              SET value = to_jsonb('$NOW'::text), \"updatedAt\" = NOW();
          "
